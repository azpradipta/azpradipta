<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <clipPath id="clip2"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>

  <style>
    @keyframes popIn { 0% { opacity: 0; transform: scale(.7) translateY(14px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes pulseNum { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
    @keyframes sparkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    .card { animation: popIn .7s ease-out both; transform-box: fill-box; transform-origin: center; }
    .c1 { animation-delay: .1s; } .c2 { animation-delay: .3s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .7s; }
    .num { animation: pulseNum 2.4s ease-in-out infinite; }
    .spark { animation: sparkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: .4s; } .s3 { animation-delay: .8s; }
  </style>

  <g clip-path="url(#clip2)">
    <rect width="900" height="280" fill="url(#bg2)"/>
    <rect x="6" y="6" width="888" height="268" rx="14" fill="none" stroke="#EDBB00" stroke-width="2" opacity="0.5"/>

    <text x="450" y="42" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="bold" fill="#EDBB00">🏆 TROPHY CABINET</text>

    <!-- Stat cards -->
    <g class="card c1">
      <rect x="40" y="68" width="190" height="100" rx="14" fill="#A50044"/>
      <text x="135" y="118" text-anchor="middle" font-family="Verdana" font-size="34" font-weight="bold" fill="#EDBB00" class="num">16</text>
      <text x="135" y="145" text-anchor="middle" font-family="Verdana" font-size="13" fill="#FFFFFF">Repositories</text>
    </g>

    <g class="card c2">
      <rect x="245" y="68" width="190" height="100" rx="14" fill="#004D98"/>
      <text x="340" y="118" text-anchor="middle" font-family="Verdana" font-size="34" font-weight="bold" fill="#EDBB00" class="num">10</text>
      <text x="340" y="145" text-anchor="middle" font-family="Verdana" font-size="13" fill="#FFFFFF">Followers</text>
    </g>

    <g class="card c3">
      <rect x="450" y="68" width="190" height="100" rx="14" fill="#A50044"/>
      <text x="545" y="118" text-anchor="middle" font-family="Verdana" font-size="34" font-weight="bold" fill="#EDBB00" class="num">03</text>
      <text x="545" y="145" text-anchor="middle" font-family="Verdana" font-size="13" fill="#FFFFFF">Achievements</text>
    </g>

    <g class="card c4">
      <rect x="655" y="68" width="190" height="100" rx="14" fill="#004D98"/>
      <text x="750" y="118" text-anchor="middle" font-family="Verdana" font-size="34" font-weight="bold" fill="#EDBB00" class="num">26</text>
      <text x="750" y="145" text-anchor="middle" font-family="Verdana" font-size="13" fill="#FFFFFF">Squad Number</text>
    </g>

    <!-- Achievement badges row -->
    <g class="card c2">
      <rect x="60" y="200" width="230" height="56" rx="28" fill="#1a1a2e" stroke="#EDBB00" stroke-width="1.5"/>
      <text x="175" y="235" text-anchor="middle" font-family="Verdana" font-size="16" fill="#FFFFFF">🦈 Pull Shark &#215;2</text>
      <circle class="spark s1" cx="70" cy="210" r="3" fill="#EDBB00"/>
    </g>
    <g class="card c3">
      <rect x="335" y="200" width="220" height="56" rx="28" fill="#1a1a2e" stroke="#EDBB00" stroke-width="1.5"/>
      <text x="445" y="235" text-anchor="middle" font-family="Verdana" font-size="16" fill="#FFFFFF">⚡ Quickdraw</text>
      <circle class="spark s2" cx="345" cy="210" r="3" fill="#EDBB00"/>
    </g>
    <g class="card c4">
      <rect x="600" y="200" width="200" height="56" rx="28" fill="#1a1a2e" stroke="#EDBB00" stroke-width="1.5"/>
      <text x="700" y="235" text-anchor="middle" font-family="Verdana" font-size="16" fill="#FFFFFF">🎯 YOLO</text>
      <circle class="spark s3" cx="610" cy="210" r="3" fill="#EDBB00"/>
    </g>
  </g>
</svg>
