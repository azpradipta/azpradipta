<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>

  <style>
    @keyframes pulseGlow { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes bounce { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(180deg); } }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    .title { animation: pulseGlow 2.6s ease-in-out infinite; }
    .subtitle { animation: fadeUp 1.2s ease-out .4s both; }
    .star { animation: twinkle 1.8s ease-in-out infinite; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.4s; }
    .ball { animation: bounce 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .stripes { animation: scroll 7s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-180px); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <g class="stripes" opacity="0.16">
      <polygon points="-180,0 -130,0 -90,220 -140,220" fill="#A50044"/>
      <polygon points="-90,0 -40,0 0,220 -50,220" fill="#004D98"/>
      <polygon points="0,0 50,0 90,220 40,220" fill="#A50044"/>
      <polygon points="90,0 140,0 180,220 130,220" fill="#004D98"/>
      <polygon points="180,0 230,0 270,220 220,220" fill="#A50044"/>
      <polygon points="270,0 320,0 360,220 310,220" fill="#004D98"/>
      <polygon points="360,0 410,0 450,220 400,220" fill="#A50044"/>
      <polygon points="450,0 500,0 540,220 490,220" fill="#004D98"/>
      <polygon points="540,0 590,0 630,220 580,220" fill="#A50044"/>
      <polygon points="630,0 680,0 720,220 670,220" fill="#004D98"/>
      <polygon points="720,0 770,0 810,220 760,220" fill="#A50044"/>
      <polygon points="810,0 860,0 900,220 850,220" fill="#004D98"/>
      <polygon points="900,0 950,0 990,220 940,220" fill="#A50044"/>
      <polygon points="990,0 1040,0 1080,220 1030,220" fill="#004D98"/>
      <polygon points="1080,0 1130,0 1170,220 1120,220" fill="#A50044"/>
      <polygon points="1170,0 1220,0 1260,220 1210,220" fill="#004D98"/>
    </g>

    <circle class="star d1" cx="70" cy="35" r="2.6" fill="#EDBB00"/>
    <circle class="star d2" cx="930" cy="45" r="2.2" fill="#EDBB00"/>
    <circle class="star d3" cx="880" cy="180" r="2" fill="#EDBB00"/>
    <circle class="star d4" cx="55" cy="185" r="2.4" fill="#EDBB00"/>
    <circle class="star d2" cx="500" cy="30" r="2" fill="#EDBB00"/>
    <circle class="star d4" cx="960" cy="150" r="2.2" fill="#EDBB00"/>

    <text x="500" y="98" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="bold" fill="#EDBB00" class="title" filter="url(#glow)">ARYA ZAKY PRADIPTA</text>
    <text x="500" y="132" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="17" fill="#FFFFFF" class="subtitle">Culer 🔵🔴 &#183; Full Stack Developer &#183; Web &amp; Mobile</text>

    <g class="ball">
      <circle cx="500" cy="178" r="13" fill="#FFFFFF" stroke="#0d1321" stroke-width="1.2"/>
      <path d="M 500 168 L 507 173 L 504 181 L 496 181 L 493 173 Z" fill="#0d1321"/>
      <path d="M 493 173 L 487 167" stroke="#0d1321" stroke-width="1.2"/>
      <path d="M 507 173 L 513 167" stroke="#0d1321" stroke-width="1.2"/>
      <path d="M 496 181 L 494 189" stroke="#0d1321" stroke-width="1.2"/>
      <path d="M 504 181 L 506 189" stroke="#0d1321" stroke-width="1.2"/>
    </g>
  </g>
</svg>
