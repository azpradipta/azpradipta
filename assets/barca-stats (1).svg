<svg width="920" height="330" viewBox="0 0 920 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#161B33"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2b1a"/>
      <stop offset="100%" stop-color="#09301c"/>
    </linearGradient>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scp"><rect width="920" height="330" rx="18"/></clipPath>
  </defs>

  <style>
    @keyframes pop { 0% { opacity:0; transform: translateY(16px) scale(.92) }
                     100% { opacity:1; transform: translateY(0) scale(1) } }
    @keyframes numPulse { 0%,100% { opacity:1 } 50% { opacity:.6 } }
    @keyframes dash { to { stroke-dashoffset: -120 } }
    @keyframes plPulse { 0%,100% { r:7; opacity:.85 } 50% { r:9.5; opacity:1 } }
    @keyframes mow { from { transform: translateX(0) } to { transform: translateX(-72px) } }
    @keyframes headGlow { 0%,100% { opacity:1 } 50% { opacity:.6 } }

    .tile  { animation: pop .7s ease-out both; transform-box: fill-box; transform-origin: center; }
    .num   { animation: numPulse 2.6s ease-in-out infinite; }
    .pass  { animation: dash 3s linear infinite; }
    .pl    { animation: plPulse 2.2s ease-in-out infinite; }
    .mow   { animation: mow 9s linear infinite; }
    .hd    { animation: headGlow 2.8s ease-in-out infinite; }
  </style>

  <g clip-path="url(#scp)">
    <rect width="920" height="330" fill="url(#sbg)"/>
    <rect x="6" y="6" width="908" height="318" rx="14" fill="none"
          stroke="#EDBB00" stroke-width="2" opacity="0.45"/>

    <text x="460" y="44" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="22"
          font-weight="bold" fill="#EDBB00" class="hd" filter="url(#sglow)"
          letter-spacing="3">MATCHDAY BOARD &#183; 4-3-3</text>

    <!-- pitch -->
    <rect x="34" y="74" width="430" height="222" rx="8" fill="url(#pitch)"/>
    <g class="mow" opacity="0.12">
      <rect x="-46" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="26"  y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="98" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="170" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="242" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="314" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="386" y="74" width="36" height="222" fill="#ffffff"/>
      <rect x="458" y="74" width="36" height="222" fill="#ffffff"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.30" fill="none" stroke-width="1.4">
      <rect x="42" y="82" width="414" height="206" rx="3"/>
      <line x1="249" y1="82" x2="249" y2="288"/>
      <circle cx="249" cy="185" r="34"/>
      <rect x="42" y="133" width="56" height="104"/>
      <rect x="400" y="133" width="56" height="104"/>
    </g>

    <!-- pass routes -->
    <g>
      <line class="pass" x1="68" y1="185" x2="146" y2="161" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="146" y1="161" x2="249" y2="134" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="249" y1="134" x2="146" y2="209" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="146" y1="209" x2="249" y2="185" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="249" y1="185" x2="361" y2="185" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="361" y1="185" x2="249" y2="236" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="249" y1="236" x2="361" y2="256" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="361" y1="256" x2="249" y2="185" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="249" y1="185" x2="146" y2="110" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="146" y1="110" x2="249" y2="134" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="249" y1="134" x2="361" y2="114" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="361" y1="114" x2="361" y2="185" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
      <line class="pass" x1="361" y1="185" x2="68" y2="185" stroke="#EDBB00" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.4"/>
    </g>

    <!-- players -->
    <g>
      <circle class="pl" cx="68" cy="185" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:0.0s"/>
      <circle class="pl" cx="146" cy="110" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:0.35s"/>
      <circle class="pl" cx="146" cy="161" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:0.7s"/>
      <circle class="pl" cx="146" cy="209" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:1.05s"/>
      <circle class="pl" cx="146" cy="260" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:1.4s"/>
      <circle class="pl" cx="249" cy="134" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:1.75s"/>
      <circle class="pl" cx="249" cy="185" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:2.1s"/>
      <circle class="pl" cx="249" cy="236" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:2.45s"/>
      <circle class="pl" cx="361" cy="114" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:2.8s"/>
      <circle class="pl" cx="361" cy="185" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:3.15s"/>
      <circle class="pl" cx="361" cy="256" r="7" fill="#A50044" stroke="#EDBB00" stroke-width="1.6" style="animation-delay:3.5s"/>
    </g>

    <!-- tiki-taka ball -->
    <circle r="5.5" fill="#FFFFFF" stroke="#0B1020" stroke-width="1">
      <animateMotion dur="11s" repeatCount="indefinite" path="M 68 185 L 146 161 L 249 134 L 146 209 L 249 185 L 361 185 L 249 236 L 361 256 L 249 185 L 146 110 L 249 134 L 361 114 L 361 185 L 68 185 Z"/>
    </circle>

    <!-- scoreboard tiles -->
    <g class="tile" style="animation-delay:0.0s">
        <rect x="496" y="74" width="195" height="100" rx="14" fill="#A50044"/>
        <rect x="496" y="74" width="195" height="4" rx="2" fill="#EDBB00" opacity="0.85"/>
        <text x="593" y="130" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="36"
              font-weight="bold" fill="#EDBB00" class="num">16</text>
        <text x="593" y="154" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="11"
              fill="#FFFFFF" letter-spacing="1.4">REPOSITORIES</text>
      </g>
      <g class="tile" style="animation-delay:0.15s">
        <rect x="709" y="74" width="195" height="100" rx="14" fill="#004D98"/>
        <rect x="709" y="74" width="195" height="4" rx="2" fill="#EDBB00" opacity="0.85"/>
        <text x="806" y="130" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="36"
              font-weight="bold" fill="#EDBB00" class="num">10</text>
        <text x="806" y="154" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="11"
              fill="#FFFFFF" letter-spacing="1.4">FOLLOWERS</text>
      </g>
      <g class="tile" style="animation-delay:0.3s">
        <rect x="496" y="196" width="195" height="100" rx="14" fill="#004D98"/>
        <rect x="496" y="196" width="195" height="4" rx="2" fill="#EDBB00" opacity="0.85"/>
        <text x="593" y="252" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="36"
              font-weight="bold" fill="#EDBB00" class="num">03</text>
        <text x="593" y="276" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="11"
              fill="#FFFFFF" letter-spacing="1.4">ACHIEVEMENTS</text>
      </g>
      <g class="tile" style="animation-delay:0.45s">
        <rect x="709" y="196" width="195" height="100" rx="14" fill="#A50044"/>
        <rect x="709" y="196" width="195" height="4" rx="2" fill="#EDBB00" opacity="0.85"/>
        <text x="806" y="252" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="36"
              font-weight="bold" fill="#EDBB00" class="num">26</text>
        <text x="806" y="276" text-anchor="middle" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="11"
              fill="#FFFFFF" letter-spacing="1.4">SQUAD NUMBER</text>
      </g>

    <text x="496" y="302" font-family="Segoe UI, Verdana, Geneva, sans-serif" font-size="12" fill="#8892b0"
          letter-spacing="1">TIKI-TAKA IN PROGRESS &#183; PASS &#183; MOVE &#183; SHIP</text>
  </g>
</svg>
