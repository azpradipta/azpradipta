<svg width="1000" height="130" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A50044"/>
      <stop offset="50%" stop-color="#004D98"/>
      <stop offset="100%" stop-color="#EDBB00"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDBB00"/>
      <stop offset="50%" stop-color="#A50044"/>
      <stop offset="100%" stop-color="#004D98"/>
    </linearGradient>
    <clipPath id="clip3"><rect width="1000" height="130"/></clipPath>
  </defs>

  <style>
    @keyframes drift1 { from { transform: translateX(0); } to { transform: translateX(-500px); } }
    @keyframes drift2 { from { transform: translateX(0); } to { transform: translateX(500px); } }
    @keyframes riseUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .wA { animation: drift1 6s linear infinite; }
    .wB { animation: drift2 8s linear infinite; }
    .txt { animation: riseUp 1s ease-out both; }
  </style>

  <g clip-path="url(#clip3)">
    <rect width="1000" height="130" fill="#0d1321"/>

    <g class="wB" opacity="0.5">
      <path d="M -500 90 Q -375 60 -250 90 T 0 90 T 250 90 T 500 90 T 750 90 T 1000 90 T 1250 90 T 1500 90 V 130 H -500 Z" fill="url(#wave2)"/>
    </g>
    <g class="wA" opacity="0.85">
      <path d="M -500 100 Q -375 130 -250 100 T 0 100 T 250 100 T 500 100 T 750 100 T 1000 100 T 1250 100 T 1500 100 V 130 H -500 Z" fill="url(#wave1)"/>
    </g>

    <text x="500" y="50" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" class="txt">🔵🔴 Visca el Barça, Visca el Code 🔴🔵</text>
  </g>
</svg>
